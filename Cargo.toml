[package]
name = "textforge-node"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Typed Node.js N-API adapter for TextForge"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
textforge = { path = "vendor/textforge", version = "=0.2.0", features = ["bytecode", "watchers", "buffered"] }
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[features]
bytecode = []
watchers = []
test_access = []
test-reference = ["textforge/test_access"]

[workspace]
exclude = ["vendor/textforge", "scripts/upstream"]

[[example]]
name = "builder_reference"
required-features = ["test-reference"]

[[example]]
name = "processor_reference"
required-features = ["test-reference"]
