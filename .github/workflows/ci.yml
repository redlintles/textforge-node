name: Validate Node binding
on: [push, pull_request]
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path scripts/upstream/Cargo.toml
      - run: npm run build
      - run: python scripts/check.py
      - run: git diff --exit-code -- ts/native-types.d.ts
      - run: npm run test:distribution
      - if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: node scripts/check-distribution.mjs --source
      - uses: actions/upload-artifact@v4
        with:
          name: textforge-node-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            native.node
            dist/
            LICENSE
            README.md
            Changelog.md
          retention-days: 7
